<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tokotter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="toko-head">
        <div class="toko-brand" aria-label="tokotter">
          <img src="/icons/128.png" class="toko-mark" alt="tokotter" />
          <div>
            <div class="toko-name">tokotter</div>
            <div class="toko-tagline" data-i18n="app.tagline"></div>
          </div>
        </div>
        <select id="locale" class="toko-locale" aria-label="Language">
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </header>

      <nav class="toko-tabs" role="tablist" aria-label="tokotter">
        <button role="tab" data-tab="inspect" data-i18n="tab.inspect"></button>
        <button role="tab" data-tab="tokens" data-i18n="tab.tokens"></button>
        <button role="tab" data-tab="clone" data-i18n="tab.clone"></button>
        <button role="tab" data-tab="library" data-i18n="tab.library"></button>
        <button role="tab" data-tab="settings" data-i18n="tab.settings"></button>
      </nav>

      <main id="view" class="toko-view"></main>
      <div id="toast" class="toko-toast" role="status" hidden></div>
    </div>
    <script type="module" src="main.ts"></script>
  </body>
</html>
